<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="席決め">
<meta name="theme-color" content="#0f0c29">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>グループ席決めアプリ</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; min-height: 100vh;
  font-family: 'Zen Kaku Gothic New','Noto Sans JP',sans-serif;
  color: #fff;
  padding: env(safe-area-inset-top,16px) 12px calc(env(safe-area-inset-bottom,0px) + 80px) 12px;
  transition: background 0.35s ease;
}
body.mode-group {
  background: linear-gradient(160deg, #73c9ed 0%, #74b9df 42%, #476fbe 100%);
}
body.mode-nomikai {
  background: radial-gradient(circle at 18% 0%, #58315e 0%, transparent 32%), linear-gradient(150deg, #090b20 0%, #1a1736 52%, #331b38 100%);
}
body.mode-group .panel, body.mode-group .table-card {
  background: rgba(255,255,255,0.16);
  border-color: rgba(255,255,255,0.30);
  box-shadow: 0 8px 24px rgba(23,78,136,0.13);
}
body.mode-group .mode-tabs { background: rgba(255,255,255,0.21); }
body.mode-group .pool { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.34); }
body.mode-group .table-surface { background: linear-gradient(135deg,#8d5e39,#5a321f); }
body.mode-nomikai .panel, body.mode-nomikai .table-card { box-shadow: 0 10px 28px rgba(0,0,0,0.22); }
.mode-tabs { display:flex; gap:8px; margin-bottom:20px; background:rgba(255,255,255,0.06); border-radius:14px; padding:5px; }
.mode-tab { flex:1; padding:10px 0; border:none; border-radius:10px; font-family:inherit; font-size:14px; font-weight:800; cursor:pointer; transition:all 0.2s; color:rgba(255,255,255,0.4); background:transparent; }
.mode-tab.active-nomikai { background:linear-gradient(135deg,#FFD700,#FF6B6B); color:#fff; }
.mode-tab.active-group   { background:linear-gradient(135deg,#48DBFB,#5F27CD); color:#fff; }
.app-icon { text-align:center; font-size:36px; margin-bottom:4px; }
h1 { text-align:center; margin:0 0 4px; font-size:22px; font-weight:900; letter-spacing:2px; }
h1.nomikai { background:linear-gradient(90deg,#FFD700,#FF6B6B,#FF9FF3); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
h1.group   { background:linear-gradient(90deg,#48DBFB,#5F27CD,#FF9FF3); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.subtitle { text-align:center; color:rgba(255,255,255,0.4); font-size:12px; margin-bottom:20px; }
.panel { background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); border-radius:16px; padding:16px; margin-bottom:14px; }
.panel-title { font-weight:800; font-size:13px; margin-bottom:12px; }
.panel-title.gold { color:#FFD700; } .panel-title.cyan { color:#48DBFB; } .panel-title.gray { color:rgba(255,255,255,0.5); }
.row { display:flex; gap:8px; align-items:center; }
.col { display:flex; flex-direction:column; gap:4px; flex:1; }
label { font-size:11px; color:rgba(255,255,255,0.5); }
input[type=number], textarea { background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); border-radius:10px; padding:10px 12px; color:#fff; font-size:15px; outline:none; width:100%; font-family:inherit; }
textarea { resize:vertical; min-height:100px; line-height:1.7; }
input::placeholder, textarea::placeholder { color:rgba(255,255,255,0.3); }
.btn { width:100%; padding:12px 0; border:none; border-radius:12px; color:#fff; font-weight:800; font-size:14px; cursor:pointer; font-family:inherit; margin-top:10px; }
.btn-gold  { background:linear-gradient(135deg,#FFD700,#FF6B6B); }
.btn-cyan  { background:linear-gradient(135deg,#48DBFB,#54A0FF); }
.btn-group { background:linear-gradient(135deg,#48DBFB,#5F27CD); }
.btn-pink  { background:linear-gradient(135deg,#FF9FF3,#FF6B6B); font-size:16px; padding:14px 0; }
.btn-reset { width:100%; padding:10px 0; background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.15); border-radius:12px; color:rgba(255,255,255,0.45); font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; margin-bottom:14px; }
.btn:active,.btn-reset:active { opacity:0.8; transform:scale(0.98); }
.toggle-row { display:flex; align-items:center; justify-content:space-between; }
.toggle-label { font-size:13px; font-weight:700; color:rgba(255,255,255,0.8); }
.toggle-desc { font-size:11px; color:rgba(255,255,255,0.4); margin-top:2px; }
.toggle-switch { position:relative; width:50px; height:28px; flex-shrink:0; }
.toggle-switch input { opacity:0; width:0; height:0; }
.toggle-slider { position:absolute; inset:0; border-radius:28px; background:rgba(255,255,255,0.15); cursor:pointer; transition:0.3s; }
.toggle-slider:before { content:''; position:absolute; width:22px; height:22px; border-radius:50%; left:3px; top:3px; background:#fff; transition:0.3s; }
input:checked + .toggle-slider { background:linear-gradient(135deg,#FFD700,#FF6B6B); }
input:checked + .toggle-slider:before { transform:translateX(22px); }
.pool { min-height:60px; display:flex; flex-wrap:wrap; gap:8px; border:2px dashed rgba(255,255,255,0.15); border-radius:14px; padding:12px; transition:all 0.2s; }
.pool.drag-over { border-color:#FFD700; background:rgba(255,215,0,0.08); }
.pool-empty { font-size:12px; color:rgba(255,255,255,0.25); align-self:center; }
.chip { border-radius:20px; padding:6px 12px; font-size:13px; font-weight:700; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,0.4); display:flex; align-items:center; gap:6px; box-shadow:0 2px 8px rgba(0,0,0,0.2); cursor:grab; user-select:none; touch-action:none; }
.chip-x { cursor:pointer; opacity:0.7; font-size:11px; }
.tables-area { display:flex; flex-direction:column; gap:14px; }
.table-card { background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); border-radius:18px; padding:16px; overflow-x:auto; -webkit-overflow-scrolling:touch; }
.table-header { display:flex; align-items:center; gap:8px; margin-bottom:14px; }
.table-name { font-weight:800; font-size:14px; background:linear-gradient(135deg,#FFD700,#FF6B6B); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.table-name.group-style { background:linear-gradient(135deg,#48DBFB,#5F27CD); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.table-size { font-size:11px; color:rgba(255,255,255,0.4); font-family:monospace; }
.table-del { margin-left:auto; background:#FF6B6B; border:none; border-radius:50%; width:24px; height:24px; color:#fff; cursor:pointer; font-size:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.dining-table { display:flex; align-items:center; justify-content:center; gap:8px; min-width:max-content; margin:0 auto; padding:4px 0; }
.table-layout { display:flex; flex-direction:column; gap:8px; flex:0 0 auto; }
.table-middle-row { display:block; }
.table-surface { width:100%; height:48px; min-width:0; display:flex; align-items:center; justify-content:center; border-radius:12px; border:1px solid rgba(255,223,155,0.3); background:linear-gradient(135deg,#85502d,#4b281c); box-shadow:inset 0 1px 0 rgba(255,255,255,0.14),0 7px 18px rgba(0,0,0,0.22); font-size:9px; color:rgba(255,232,190,0.65); letter-spacing:3px; }
.seats-row { display:flex; gap:6px; justify-content:center; flex-wrap:nowrap; }
.seat-end { width:44px; height:50px; border-radius:12px; border:2px dashed rgba(255,215,0,0.62); background:rgba(255,215,0,0.07); display:flex; align-items:center; justify-content:center; position:relative; transition:all 0.18s; cursor:default; user-select:none; box-shadow:0 0 12px rgba(255,215,0,0.18); flex-shrink:0; }
.seat-end.occupied { border:2px solid rgba(255,215,0,0.7); box-shadow:0 0 14px rgba(255,215,0,0.4); cursor:grab; }
.seat-end.drag-over { border-color:#FFD700; background:rgba(255,215,0,0.2); transform:scale(1.05); }
.end-crown { position:absolute; top:-10px; left:50%; transform:translateX(-50%); font-size:12px; }
.seat { width:72px; height:58px; border-radius:10px; border:2px dashed rgba(255,255,255,0.25); background:rgba(255,255,255,0.06); display:flex; align-items:center; justify-content:center; position:relative; transition:all 0.18s; cursor:default; user-select:none; flex-shrink:0; }
.seat.occupied { border:2px solid transparent; cursor:grab; }
.seat.drag-over { border-color:#FFD700; background:rgba(255,215,0,0.15); transform:scale(1.05); }
.seat-name { font-size:11px; font-weight:700; color:#fff; text-shadow:0 1px 4px rgba(0,0,0,0.5); text-align:center; word-break:break-all; line-height:1.2; padding:0 4px; }
.seat-empty { font-size:9px; color:rgba(255,255,255,0.25); text-align:center; }
.seat-x { position:absolute; top:2px; right:2px; background:rgba(0,0,0,0.35); border:none; border-radius:50%; width:16px; height:16px; color:#fff; cursor:pointer; font-size:9px; display:flex; align-items:center; justify-content:center; }
.group-seats-grid { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
.no-tables { border:2px dashed rgba(255,255,255,0.1); border-radius:18px; padding:40px 20px; text-align:center; color:rgba(255,255,255,0.25); font-size:14px; }
</style>
</head>
<body class="mode-group">
<div class="mode-tabs">
  <button class="mode-tab active-group" id="tab-group" onclick="setMode('group')">👥 グループワーク</button>
  <button class="mode-tab" id="tab-nomikai" onclick="setMode('nomikai')">🍻 飲み会</button>
</div>
<div class="app-icon" id="appIcon">👥</div>
<h1 id="appTitle" class="group">グループ席決めアプリ</h1>
<div class="subtitle">参加者 0人 / 席 0席 / 着席済 0人</div>
<!-- 飲み会モード：テーブル追加 -->
<div class="panel" id="nomikaiTablePanel">
  <div class="panel-title gold">＋ テーブル追加</div>
  <div class="row">
    <div class="col"><label>行数（縦）</label><input type="number" id="newRows" value="2" min="1" max="10"></div>
    <span style="color:rgba(255,255,255,0.4);margin-top:18px">×</span>
    <div class="col"><label>列数（横）</label><input type="number" id="newCols" value="4" min="1" max="10"></div>
  </div>
  <button class="btn btn-gold" onclick="addTable()">テーブルを追加</button>
</div>

<!-- グループワークモード：人数÷グループ数 -->
<div class="panel" id="groupGenPanel" style="display:none">
  <div class="panel-title" style="color:#48DBFB">👥 グループを自動生成</div>
  <div class="row" style="margin-bottom:10px">
    <div class="col"><label>グループ数</label><input type="number" id="groupCount" value="4" min="1" max="20" oninput="updateGroupHint()"></div>
    <div class="col"><label>1グループの人数</label><input type="number" id="groupSize" value="4" min="1" max="20" oninput="updateGroupHint()"></div>
  </div>
  <div style="font-size:12px;color:rgba(255,255,255,0.35);margin-bottom:10px" id="groupHint">合計 16席 が作られます</div>
  <button class="btn btn-group" onclick="generateGroups()">グループを生成</button>
</div>
<div class="panel" id="birthdayPanel">
  <div class="toggle-row">
    <div>
      <div class="toggle-label">🪑 端席モード</div>
      <div class="toggle-desc">テーブルの左右端に独立した席を追加</div>
    </div>
    <label class="toggle-switch">
      <input type="checkbox" id="birthdayToggle" onchange="render()">
      <span class="toggle-slider"></span>
    </label>
  </div>
</div>
<div class="panel">
  <div class="panel-title cyan">👥 参加者を一括入力</div>
  <textarea id="nameInput" placeholder="名前を改行で区切って入力&#10;&#10;例）&#10;青木&#10;伊澤&#10;宇崎"></textarea>
  <button class="btn btn-cyan" onclick="addPeople()">追加する</button>
</div>
<button class="btn btn-pink" onclick="shuffle()" style="margin-bottom:8px">🎲 ランダム席決め</button>
<button class="btn-reset" onclick="clearAll()">🗑️ リセット</button>
<div class="panel">
  <div class="panel-title gray" id="poolTitle">未着席 (0人)</div>
  <div class="pool" id="pool"
    ondragover="event.preventDefault();this.classList.add('drag-over')"
    ondragleave="this.classList.remove('drag-over')"
    ondrop="dropToPool(event)">
    <span class="pool-empty">名前を追加するか、席からドラッグして戻してください</span>
  </div>
</div>
<div class="tables-area" id="tablesArea">
  <div class="no-tables" id="noTables">上からテーブルを追加してください</div>
</div>
<div id="saveToast" style="position:fixed;bottom:calc(env(safe-area-inset-bottom,0px)+24px);left:50%;transform:translateX(-50%);background:rgba(29,209,161,0.92);color:#fff;padding:8px 20px;border-radius:20px;font-size:13px;font-weight:700;pointer-events:none;opacity:0;transition:opacity 0.3s;z-index:9999;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,0.3);">💾 自動保存しました</div>

<script>
let tables=[], people=[], dragging=null, currentMode='group';
const COLORS=["#FF6B6B","#FF9F43","#FECA57","#1DD1A1","#48DBFB","#54A0FF","#FF9FF3","#F368E0","#00D2D3","#EE5A24","#009432","#0652DD","#9980FA","#5F27CD","#C8D6E5","#FD7272","#B33771","#3B3B98","#6D214F","#182C61"];
const nameColorMap={};let colorUsageCount=Array(COLORS.length).fill(0);
function getColor(n){if(nameColorMap[n])return nameColorMap[n];let m=Infinity,mi=0;for(let i=0;i<COLORS.length;i++)if(colorUsageCount[i]<m){m=colorUsageCount[i];mi=i;}colorUsageCount[mi]++;nameColorMap[n]=COLORS[mi];return COLORS[mi];}
function releaseColor(n){if(!nameColorMap[n])return;const i=COLORS.indexOf(nameColorMap[n]);if(i>=0)colorUsageCount[i]=Math.max(0,colorUsageCount[i]-1);delete nameColorMap[n];}
function birthdayOn(){return document.getElementById('birthdayToggle').checked;}

function setMode(mode){
  currentMode=mode;
  document.body.className='mode-'+mode;
  document.getElementById('tab-nomikai').className='mode-tab'+(mode==='nomikai'?' active-nomikai':'');
  document.getElementById('tab-group').className='mode-tab'+(mode==='group'?' active-group':'');
  document.getElementById('appIcon').textContent=mode==='nomikai'?'🍻':'📚';
  const t=document.getElementById('appTitle');
  t.textContent=mode==='nomikai'?'飲み会 席決めアプリ':'グループワーク 席決め';
  t.className=mode==='nomikai'?'nomikai':'group';
  document.getElementById('birthdayPanel').style.display=mode==='nomikai'?'':'none';
  document.getElementById('nomikaiTablePanel').style.display=mode==='nomikai'?'':'none';
  document.getElementById('groupGenPanel').style.display=mode==='group'?'':'none';
  render();
}

function updateGroupHint(){
  const count=Math.max(1,+document.getElementById('groupCount').value||4);
  const size=Math.max(1,+document.getElementById('groupSize').value||4);
  document.getElementById('groupHint').textContent=`合計 ${count*size}席 が作られます`;
}

function generateGroups(){
  const count=Math.max(1,Math.min(20,+document.getElementById('groupCount').value||4));
  const size=Math.max(1,Math.min(20,+document.getElementById('groupSize').value||4));
  // 既存のgroupテーブルを一旦全員プールに戻してから再生成
  tables.filter(t=>t.mode==='group').forEach(t=>{
    [...t.seats.flat(),...t.endSeats].filter(Boolean).forEach(n=>people.push(n));
  });
  tables=tables.filter(t=>t.mode!=='group');
  // グループ生成：1行×sizeの席
  for(let i=0;i<count;i++){
    tables.push({rows:1,cols:size,seats:[Array(size).fill('')],endSeats:['',''],mode:'group'});
  }
  render();
}

function addTable(){
  const rows=Math.max(1,Math.min(10,+document.getElementById('newRows').value));
  const cols=Math.max(1,Math.min(10,+document.getElementById('newCols').value));
  tables.push({rows,cols,seats:Array.from({length:rows},()=>Array(cols).fill('')),endSeats:['',''],mode:currentMode});
  render();
}
function removeTable(i){
  const freed=[...tables[i].seats.flat(),...tables[i].endSeats].filter(Boolean);
  freed.forEach(n=>people.push(n));
  tables.splice(i,1);render();
}
function addPeople(){
  const names=document.getElementById('nameInput').value.split('\n').map(s=>s.trim()).filter(Boolean);
  if(!names.length)return;
  names.forEach(n=>people.push(n));
  document.getElementById('nameInput').value='';render();
}
function removePerson(i){releaseColor(people[i]);people.splice(i,1);render();}
function removeSeat(ti,r,c){const n=tables[ti].seats[r][c];if(n){people.push(n);tables[ti].seats[r][c]='';}render();}
function removeEndSeat(ti,side){const n=tables[ti].endSeats[side];if(n){people.push(n);tables[ti].endSeats[side]='';}render();}

function shuffle(){
  const all=[...people,...tables.flatMap(t=>[...t.seats.flat(),...t.endSeats]).filter(Boolean)];
  for(let i=all.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[all[i],all[j]]=[all[j],all[i]];}
  let idx=0;
  tables=tables.map(t=>{
    const newSeats=t.seats.map(row=>row.map(()=>all[idx++]||''));
    const newEnd=t.mode==='nomikai'&&birthdayOn()?[all[idx++]||'',all[idx++]||'']:['',''];
    return{...t,seats:newSeats,endSeats:newEnd};
  });
  people=all.slice(idx);render();
}

function clearAll(){
  if(!confirm('全データをリセットしますか？\n（全モードのテーブル・参加者がすべて消えます）'))return;
  tables=[];people=[];
  Object.keys(nameColorMap).forEach(k=>delete nameColorMap[k]);
  colorUsageCount=Array(COLORS.length).fill(0);
  saveData();render();
}

function onDragStartPool(i){dragging={source:'pool',name:people[i],poolIdx:i};}
function onDragStartSeat(ti,r,c){const n=tables[ti].seats[r][c];if(n)dragging={source:'seat',name:n,tableIdx:ti,row:r,col:c};}
function onDragStartEnd(ti,side){const n=tables[ti].endSeats[side];if(n)dragging={source:'end',name:n,tableIdx:ti,side};}
function clearDraggingSource(){
  if(!dragging)return;
  if(dragging.source==='seat')tables[dragging.tableIdx].seats[dragging.row][dragging.col]='';
  else if(dragging.source==='end')tables[dragging.tableIdx].endSeats[dragging.side]='';
}
function placeDragging(tgt,setter){
  setter(dragging.name);
  if(dragging.source==='pool'){if(tgt)people.push(tgt);people.splice(dragging.poolIdx,1);}
  else if(dragging.source==='seat'){tables[dragging.tableIdx].seats[dragging.row][dragging.col]=tgt||'';}
  else if(dragging.source==='end'){tables[dragging.tableIdx].endSeats[dragging.side]=tgt||'';}
  dragging=null;render();
}
function dropToSeat(e,ti,r,c){e.preventDefault();e.currentTarget.classList.remove('drag-over');if(!dragging)return;const tgt=tables[ti].seats[r][c];placeDragging(tgt,n=>{tables[ti].seats[r][c]=n;});}
function dropToEnd(e,ti,side){e.preventDefault();e.currentTarget.classList.remove('drag-over');if(!dragging)return;const tgt=tables[ti].endSeats[side];placeDragging(tgt,n=>{tables[ti].endSeats[side]=n;});}
function dropToPool(e){
  e.preventDefault();document.getElementById('pool').classList.remove('drag-over');
  if(!dragging)return;
  people.push(dragging.name);clearDraggingSource();dragging=null;render();
}

let touchDragging=null,touchClone=null;
function onTouchStart(e,source,data){
  touchDragging={source,data};
  const el=e.currentTarget,rect=el.getBoundingClientRect();
  touchClone=el.cloneNode(true);
  touchClone.style.cssText=`position:fixed;top:${rect.top}px;left:${rect.left}px;width:${rect.width}px;height:${rect.height}px;opacity:0.8;pointer-events:none;z-index:9999;transition:none;`;
  document.body.appendChild(touchClone);e.preventDefault();
}
document.addEventListener('touchmove',e=>{if(!touchClone)return;const t=e.touches[0];touchClone.style.top=(t.clientY-30)+'px';touchClone.style.left=(t.clientX-40)+'px';e.preventDefault();},{passive:false});
document.addEventListener('touchend',e=>{
  if(!touchClone||!touchDragging)return;
  const t=e.changedTouches[0];touchClone.remove();touchClone=null;
  const el=document.elementFromPoint(t.clientX,t.clientY);
  if(!el){touchDragging=null;return;}
  const td=touchDragging;
  dragging=td.source==='pool'?{source:'pool',name:td.data.name,poolIdx:td.data.idx}
    :td.source==='seat'?{source:'seat',name:td.data.name,tableIdx:td.data.ti,row:td.data.r,col:td.data.c}
    :{source:'end',name:td.data.name,tableIdx:td.data.ti,side:td.data.side};
  const seatEl=el.closest('[data-seat]'),endEl=el.closest('[data-end]'),poolEl=el.closest('#pool');
  if(seatEl){const ti=+seatEl.dataset.ti,r=+seatEl.dataset.r,c=+seatEl.dataset.c;placeDragging(tables[ti].seats[r][c],n=>{tables[ti].seats[r][c]=n;});}
  else if(endEl){const ti=+endEl.dataset.ti,side=+endEl.dataset.side;placeDragging(tables[ti].endSeats[side],n=>{tables[ti].endSeats[side]=n;});}
  else if(poolEl){people.push(dragging.name);clearDraggingSource();dragging=null;render();}
  else{dragging=null;}
  touchDragging=null;
},{passive:false});

function saveData(){
  try{
    localStorage.setItem('nomikai_tables',JSON.stringify(tables));
    localStorage.setItem('nomikai_people',JSON.stringify(people));
    localStorage.setItem('nomikai_colorMap',JSON.stringify(nameColorMap));
    localStorage.setItem('nomikai_colorCount',JSON.stringify(colorUsageCount));
    localStorage.setItem('nomikai_mode',currentMode);
    localStorage.setItem('nomikai_birthday',document.getElementById('birthdayToggle').checked?'1':'0');
  }catch(e){}
}
function loadData(){
  try{
    const t=localStorage.getItem('nomikai_tables'),p=localStorage.getItem('nomikai_people');
    const cm=localStorage.getItem('nomikai_colorMap'),cc=localStorage.getItem('nomikai_colorCount');
    const m=localStorage.getItem('nomikai_mode'),bd=localStorage.getItem('nomikai_birthday');
    if(t)tables=JSON.parse(t);
    if(p)people=JSON.parse(p);
    if(cm)Object.assign(nameColorMap,JSON.parse(cm));
    if(cc)colorUsageCount=JSON.parse(cc);
    if(m)currentMode=m;
    if(bd)document.getElementById('birthdayToggle').checked=(bd==='1');
  }catch(e){}
}

let toastTimer=null;
function render(){
  renderPool();renderTables();updateStats();saveData();
  const toast=document.getElementById('saveToast');
  toast.style.opacity='1';clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{toast.style.opacity='0';},1500);
}
function renderPool(){
  const pool=document.getElementById('pool');
  document.getElementById('poolTitle').textContent=`未着席 (${people.length}人)`;
  pool.innerHTML='';
  if(!people.length){pool.innerHTML='<span class="pool-empty">名前を追加するか、席からドラッグして戻してください</span>';return;}
  people.forEach((name,i)=>{
    const div=document.createElement('div');div.className='chip';div.style.background=getColor(name)+'cc';div.draggable=true;
    div.addEventListener('dragstart',()=>onDragStartPool(i));
    div.addEventListener('touchstart',e=>onTouchStart(e,'pool',{name,idx:i}),{passive:false});
    const ns=document.createElement('span');ns.textContent=name;
    const xb=document.createElement('span');xb.className='chip-x';xb.textContent='✕';xb.addEventListener('click',()=>removePerson(i));
    div.appendChild(ns);div.appendChild(xb);pool.appendChild(div);
  });
}
function renderTables(){
  const area=document.getElementById('tablesArea'),noT=document.getElementById('noTables');
  if(!tables.length){area.innerHTML='';area.appendChild(noT);noT.style.display='';return;}
  area.innerHTML='';
  tables.forEach((t,ti)=>{
    const{rows,cols}=t,isGroup=(t.mode==='group');
    const card=document.createElement('div');card.className='table-card';
    const hdr=document.createElement('div');hdr.className='table-header';
    const ns=document.createElement('span');ns.className='table-name'+(isGroup?' group-style':'');
    ns.textContent=(isGroup?'📚 グループ ':'🍺 テーブル ')+(ti+1);
    const ss=document.createElement('span');ss.className='table-size';
    ss.textContent=`${rows}×${cols}`+(birthdayOn()&&!isGroup?' +端2':'');
    const db=document.createElement('button');db.className='table-del';db.textContent='✕';
    db.addEventListener('click',()=>removeTable(ti));
    hdr.appendChild(ns);hdr.appendChild(ss);hdr.appendChild(db);card.appendChild(hdr);
    if(isGroup){
      const g=document.createElement('div');g.className='group-seats-grid';
      for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)g.appendChild(makeSeat(t,ti,r,c,72));
      card.appendChild(g);
    } else {
      const ss=calcSeatSize(cols);
      const tableWidth=cols*ss+(cols-1)*6;
      const dining=document.createElement('div');dining.className='dining-table';
      const layout=document.createElement('div');layout.className='table-layout';layout.style.width=tableWidth+'px';
      const topRow=document.createElement('div');topRow.className='seats-row';
      for(let c=0;c<cols;c++)topRow.appendChild(makeSeat(t,ti,0,c,ss));
      layout.appendChild(topRow);
      for(let r=1;r<rows-1;r++){
        const row=document.createElement('div');row.className='seats-row';
        for(let c=0;c<cols;c++)row.appendChild(makeSeat(t,ti,r,c,ss));
        layout.appendChild(row);
      }
      const midRow=document.createElement('div');midRow.className='table-middle-row';
      const surf=document.createElement('div');surf.className='table-surface';surf.textContent='TABLE';
      midRow.appendChild(surf);layout.appendChild(midRow);
      if(rows>=2){
        const botRow=document.createElement('div');botRow.className='seats-row';
        for(let c=0;c<cols;c++)botRow.appendChild(makeSeat(t,ti,rows-1,c,ss));
        layout.appendChild(botRow);
      }
      if(birthdayOn())dining.appendChild(makeEndSeat(t,ti,0));
      dining.appendChild(layout);
      if(birthdayOn())dining.appendChild(makeEndSeat(t,ti,1));
      card.appendChild(dining);
    }
    area.appendChild(card);
  });
}
function calcSeatSize(cols){
  // カード内の利用可能幅を推定（画面幅 - padding*2 - card padding*2）
  const available = Math.min(window.innerWidth, 600) - 24 - 32;
  // 端席がある場合は、席本体の幅を先に確保して左右に独立配置する
  const endW = birthdayOn() ? (44*2 + 16) : 0;
  const gapTotal = (cols - 1) * 6;
  const maxW = Math.floor((available - endW - gapTotal) / cols);
  // 最小44px、最大72px
  return Math.max(44, Math.min(72, maxW));
}
function makeSeat(t,ti,r,c,seatSize){
  seatSize = seatSize || 72;
  const name=t.seats[r][c],sd=document.createElement('div');
  sd.className='seat'+(name?' occupied':'');
  sd.dataset.seat='';sd.dataset.ti=ti;sd.dataset.r=r;sd.dataset.c=c;
  sd.style.width=seatSize+'px';
  sd.style.height=Math.round(seatSize*0.8+10)+'px';
  sd.style.fontSize=seatSize<56?'9px':'11px';
  sd.style.background=name?getColor(name)+'cc':'rgba(255,255,255,0.06)';
  sd.style.border=name?'2px solid transparent':'2px dashed rgba(255,255,255,0.25)';
  sd.addEventListener('dragover',e=>{e.preventDefault();sd.classList.add('drag-over');});
  sd.addEventListener('dragleave',()=>sd.classList.remove('drag-over'));
  sd.addEventListener('drop',e=>dropToSeat(e,ti,r,c));
  if(name){
    sd.draggable=true;
    sd.addEventListener('dragstart',()=>onDragStartSeat(ti,r,c));
    sd.addEventListener('touchstart',e=>onTouchStart(e,'seat',{name,ti,r,c}),{passive:false});
    const ns=document.createElement('span');ns.className='seat-name';ns.textContent=name;
    const xb=document.createElement('button');xb.className='seat-x';xb.textContent='✕';xb.addEventListener('click',()=>removeSeat(ti,r,c));
    sd.appendChild(ns);sd.appendChild(xb);
  } else {
    const em=document.createElement('span');em.className='seat-empty';em.textContent='空席';sd.appendChild(em);
  }
  return sd;
}
function makeEndSeat(t,ti,side){
  const name=t.endSeats[side],sd=document.createElement('div');
  sd.className='seat-end'+(name?' occupied':'');
  sd.dataset.end='';sd.dataset.ti=ti;sd.dataset.side=side;
  sd.style.background=name?getColor(name)+'cc':'rgba(255,215,0,0.05)';
  const cr=document.createElement('div');cr.className='end-crown';cr.textContent='端';sd.appendChild(cr);
  sd.addEventListener('dragover',e=>{e.preventDefault();sd.classList.add('drag-over');});
  sd.addEventListener('dragleave',()=>sd.classList.remove('drag-over'));
  sd.addEventListener('drop',e=>dropToEnd(e,ti,side));
  if(name){
    sd.draggable=true;
    sd.addEventListener('dragstart',()=>onDragStartEnd(ti,side));
    sd.addEventListener('touchstart',e=>onTouchStart(e,'end',{name,ti,side}),{passive:false});
    const ns=document.createElement('span');ns.className='seat-name';ns.textContent=name;
    const xb=document.createElement('button');xb.className='seat-x';xb.textContent='✕';xb.addEventListener('click',()=>removeEndSeat(ti,side));
    sd.appendChild(ns);sd.appendChild(xb);
  } else {
    const em=document.createElement('span');em.className='seat-empty';em.textContent='端席';sd.appendChild(em);
  }
  return sd;
}
function updateStats(){
  const ts=tables.reduce((a,t)=>a+t.rows*t.cols+(birthdayOn()&&t.mode!=='group'?2:0),0);
  const se=tables.reduce((a,t)=>a+t.seats.flat().filter(Boolean).length+t.endSeats.filter(Boolean).length,0);
  document.querySelector('.subtitle').textContent=`参加者 ${se+people.length}人 / 席 ${ts}席 / 着席済 ${se}人`;
}

if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');

window.addEventListener('load',()=>{
  loadData();
  setMode(currentMode);
});
</script>
</body>
</html>
